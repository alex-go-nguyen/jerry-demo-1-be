services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    container_name: backend
    ports:
      - '3000:3000'
    env_file:
      - .env.prod
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy
  
  redis:
    image: redis:6.2-alpine
    container_name: redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      retries: 5
      start_period: 5s

volumes:
  redis_data: